site_name: OpenTLV
site_description: Portable TLV processing with a canonical C engine, language APIs, CLI and WebAssembly.
site_url: https://opentlv.github.io/opentlv-docs/
repo_url: https://github.com/OpenTLV/opentlv
repo_name: OpenTLV/opentlv
# The source hook sets page-specific links to the owning repository.
edit_uri: edit/main/docs/

# Validated initially against portal assets; assembly selects disposable output.
docs_dir: docs
site_dir: site
strict: true

# Several checks are only reported as INFO by default; warn so strict fails on
# them: pages missing from nav, absolute links, missing nav files and anchors.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# docs/README.md is the GitHub index; the site landing page is docs/index.md.
exclude_docs: |
  /README.md

theme:
  name: material
  custom_dir: tools/docs/overrides
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link

extra:
  # Source ownership is independent of the product repository in the header.
  portal_repository: https://github.com/OpenTLV/opentlv-docs
  # tools/docs/hooks.py reads OPENTLV_DOCS_CHANNEL; local previews always use
  # development presentation (tools/docs/overrides/main.html).
  docs_channel: development
  # CI prepares versioned builds with mike before deploying the complete site.
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenTLV
      name: OpenTLV on GitHub

# Rewrites relative links that leave docs/ (source files, README, CHANGELOG)
# to GitHub URLs, so the Markdown stays valid on GitHub and in the site.
hooks:
  - tools/docs/assembly.py
  - tools/docs/hooks.py
  - tools/docs/navigation.py

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # C/C++ content tabs (/// tab | C); see docs/development/documentation-layout.md.
  - pymdownx.blocks.tab:
      alternate_style: true

# The playground page (docs/playground/) is only a script and a stylesheet; the
# script does nothing on pages without the playground element.
extra_css:
  - playground/playground.css
extra_javascript:
  - path: playground/playground.js
    type: module

# Source paths remain owned by their repositories. navigation.py assigns the
# canonical portal output URLs and separates selected product manuals.
nav:
  - Home: index.md
  - Tutorials:
      - Overview: getting-started/overview.md
      - Understand the basic model: concepts/learning-model.md
      - First program and Core integration: getting-started/README.md
      - Choose a processing API: guides/processing.md
      - Executable examples: guides/examples.md
      - C++ workflows: guides/cxx-examples.md
      - Format examples: formats/format-examples.md
  - API:
      - Overview: api/index.md
      - Concepts and contracts:
          - Core types: concepts/core-types.md
          - Borrowed values: concepts/value.md
          - Logical lengths: concepts/length.md
          - Byte order: concepts/endian.md
          - Format, Element and source layout: concepts/format-contract.md
          - Generic Format capability space: concepts/format-capabilities.md
      - Processing:
