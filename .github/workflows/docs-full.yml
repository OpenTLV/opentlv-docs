name: Docs Full
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Documentation channel
        type: choice
        options: [development, release]
        default: development
      core_ref:
        description: Exact Core SHA or release tag (empty uses reviewed pin)
        type: string
        default: ''
  workflow_call:
    inputs:
      channel:
        type: string
        default: development
      core_ref:
        type: string
        default: ''
    secrets:
      OPENTLV_CLI_READ_TOKEN:
        required: false
      OPENTLV_COMPONENT_READ_TOKEN:
        required: false
    outputs:
      pages_commit:
        description: Verified history commit
        value: ${{ jobs.gate.outputs.pages_commit }}
      evidence_sha256:
        description: Verified evidence digest
        value: ${{ jobs.gate.outputs.evidence_sha256 }}
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: Full documentation verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENTLV_DOCS_SOURCE_ROOT: ${{ github.workspace }}/build/sources
      OPENTLV_DOCS_LOCK: ${{ github.workspace }}/build/sources.lock.json
      OPENTLV_DOCS_LOCAL: '0'
      OPENTLV_DOCS_PUBLISH: '1'
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: |
          python -m pip install -r requirements-docs.txt
          sudo apt-get update
          sudo apt-get install -y doxygen ninja-build
      - name: Verify portal contracts and historical snapshot behavior
        run: python -B -m unittest discover -s tests -v
      - name: Record immutable history baseline
        run: python -B tools/docs/quality.py baseline
      - name: Select and lock Core documentation
        id: source
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_CORE_REF: ${{ inputs.core_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B tools/docs/ci.py select
          python -B tools/docs/ci.py fetch
      - name: Check source inventories and navigation before generation
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        env:
          OPENTLV_DOCS_CHANNEL: ${{ steps.source.outputs.channel }}
        run: python -B tools/docs/ci.py check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint portal and assembled documentation
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        run: |
          npm install --global markdownlint-cli@0.45.0
          markdownlint --config .markdownlint.json README.md CHANGELOG.md 'docs/**/*.md' build/sources/core/README.md 'build/assembled/docs/**/*.md'
      - uses: mymindstorm/setup-emsdk@v14
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        with:
          version: '4.0.10'
      - name: Generate playground assets
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        env:
          OPENTLV_DOCS_CHANNEL: ${{ steps.source.outputs.channel }}
        run: python -B tools/docs/wasm.py
      # mike performs the one strict build under the actual version prefix.
      - name: Build and prepare Core snapshot
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        env:
          OPENTLV_DOCS_CHANNEL: ${{ steps.source.outputs.channel }}
          OPENTLV_DOCS_REQUIRE_WASM: '1'
        run: python -B tools/docs/publication.py
      - name: Authenticate and prepare CLI snapshot
        if: github.event.action == 'cli-docs-released'
        env:
          GH_TOKEN: ${{ secrets.OPENTLV_CLI_READ_TOKEN }}
        run: python -B tools/docs/cli_release.py
      - name: Authenticate and prepare component snapshot
        if: github.event.action == 'component-release-published'
        env:
          GH_TOKEN: ${{ secrets.OPENTLV_COMPONENT_READ_TOKEN }}
        run: python -B tools/docs/component_release.py
      - name: Verify published playground in Chromium
        if: github.event.action != 'cli-docs-released' && github.event.action != 'component-release-published'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          python -B tools/docs/browser_smoke.py build/publication/site
      - name: Seal candidate and immutable snapshot evidence
        run: python -B tools/docs/quality.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: docs-candidate-${{ github.run_attempt }}
          path: |
            build/publication/history.bundle
            build/publication/site.tar
            build/publication/evidence.json
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Docs Full gate
    if: always()
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pages_commit: ${{ steps.verify.outputs.pages_commit }}
      evidence_sha256: ${{ steps.verify.outputs.evidence_sha256 }}
    steps:
      - name: Require complete Full verification
        env:
          RESULT: ${{ needs.prepare.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v5
        if: always()
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - uses: actions/download-artifact@v5
        with:
          name: docs-candidate-${{ github.run_attempt }}
          path: build/candidate
      - name: Verify exact attempt, sources, checksums and history
        id: verify
        env:
          OPENTLV_DOCS_REQUIRE_WASM: ${{ (github.event.action == 'cli-docs-released' || github.event.action == 'component-release-published') && '0' || '1' }}
        run: python -B tools/docs/quality.py verify
      - uses: actions/upload-pages-artifact@v4
        with:
          name: docs-pages-${{ github.run_attempt }}
          path: build/candidate/site
      - name: Record Full timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ github.workflow == 'Docs Release' && 'Full / ' || '' }}
        run: python -B tools/docs/ci_timings.py --current --job "${PREFIX}Full documentation verification" --output build/timings/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-full-timings-${{ github.run_attempt }}
          path: build/timings/full.json
          if-no-files-found: error
