name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Documentation channel (release requires a Core release tag)
        type: choice
        options: [development, release]
        default: development
      core_ref:
        description: Core full commit SHA or tag (empty uses core-source.json)
        type: string
        default: ''
      publish:
        description: Publish after validation (main only; false is a dry run)
        type: boolean
        default: false

permissions:
  contents: read

# Publication includes validation so a later run cannot deploy ahead of it.
# GitHub may replace a pending run; an active publication is never cancelled.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and prepare documentation
    runs-on: ubuntu-24.04
    outputs:
      pages_commit: ${{ steps.prepare.outputs.pages_commit }}
    env:
      OPENTLV_CORE_DIR: ${{ github.workspace }}/build/core
      OPENTLV_DOCS_LOCAL: '0'
      # Dry runs must exercise publication guards too.
      OPENTLV_DOCS_PUBLISH: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Select Core source
        id: source
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_CORE_REF: ${{ inputs.core_ref }}
        run: python tools/docs/ci.py select

      - name: Checkout selected Core revision
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.revision }}
          path: build/core
          fetch-depth: 0
          persist-credentials: false

      - name: Install API generation tools
        run: sudo apt-get update && sudo apt-get install -y doxygen ninja-build

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Markdown linter
        run: npm install --global markdownlint-cli@0.45.0

      - name: Test portal and publication behavior
        run: python -m unittest discover -s tests -v

      - name: Check Core examples, inventories, and portal navigation
        env:
          OPENTLV_CORE_REF: ${{ steps.source.outputs.revision }}
          OPENTLV_DOCS_CHANNEL: ${{ steps.source.outputs.channel }}
        run: python tools/docs/ci.py check

      - name: Lint portal and assembled Core Markdown
        run: >-
          markdownlint --config .markdownlint.json
          README.md CHANGELOG.md 'docs/**/*.md'
          build/core/README.md 'build/assembled/docs/**/*.md'

      - name: Generate API references and build strict site
        env:
          OPENTLV_DOCS_CHANNEL: ${{ steps.source.outputs.channel }}
        run: python -m mkdocs build --strict

      # This also builds under the real version prefix and validates that build.
      # It creates local mike commits only, never pushes from validation.
      - name: Prepare versioned publication
        id: prepare
        env:
          OPENTLV_DOCS_CHANNEL: ${{ steps.source.outputs.channel }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python tools/docs/publication.py

      - name: Upload prepared version history
        uses: actions/upload-artifact@v4
        with:
          name: documentation-history
          path: build/publication/history.bundle
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete versioned site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/publication/site

  deploy:
    name: Publish validated documentation
    needs: validate
    if: >-
      github.repository == 'OpenTLV/opentlv-docs' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/download-artifact@v5
        with:
          name: documentation-history
          path: build/publication

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # No build scripts or Core code execute with this job's write token.
      # A concurrent external change fails the normal fast-forward push.
      - name: Store prepared mike history
        env:
          PAGES_COMMIT: ${{ needs.validate.outputs.pages_commit }}
        run: |
          git bundle verify build/publication/history.bundle
          git fetch build/publication/history.bundle refs/heads/gh-pages:refs/heads/gh-pages
          test "$(git rev-parse refs/heads/gh-pages)" = "$PAGES_COMMIT"
          git push origin refs/heads/gh-pages:refs/heads/gh-pages

      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
