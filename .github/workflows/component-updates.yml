name: Documentation source update

on:
  repository_dispatch:
    types: [core-docs-updated, component-docs-updated, component-docs-released]

permissions:
  contents: read
  actions: read

concurrency:
  # Keep one proposal per source; reject delayed events against the pending pin.
  group: docs-source-${{ github.event.client_payload.source }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.repository == 'OpenTLV/opentlv-docs' &&
      (github.event.action != 'core-docs-updated' || github.event.client_payload.ref == 'main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source validation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Verify producer and prepare pinned source update
        id: proposal
        env:
          GH_TOKEN: ${{ secrets.DOCS_SOURCE_READ_TOKEN || github.token }}
        run: python tools/docs/events.py
      - name: Select source update files
        id: update-paths
        if: steps.proposal.outputs.changed == 'true'
        shell: bash
        run: |
          # git add rejects unmatched pathspecs; resolve optional evidence first.
          paths="$(git ls-files --cached --others --exclude-standard -- docs-sources.json ':(glob)compatibility/**/*.json')"
          {
            echo 'paths<<EOF'
            printf '%s\n' "$paths"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      # An App/PAT is needed so the resulting PR starts the normal docs checks.
      # Stage only the manifest and verified JSON evidence, never producer code.
      - name: Open reviewed source update
        id: pull-request
        if: steps.proposal.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DOCS_UPDATES_TOKEN }}
          add-paths: ${{ steps.update-paths.outputs.paths }}
          branch: automation/component-${{ github.event.client_payload.source }}
          title: Update pinned ${{ github.event.client_payload.source }} documentation sources
          commit-message: Update pinned documentation sources and compatibility evidence
          body: |
            Proposes exact source pins from a successful configured producer, with verified compatibility evidence for components.
            Review the producer, feed records and documentation validation before merging. Existing releases remain frozen.
            Producer: https://github.com/${{ github.event.client_payload.repository }}/actions/runs/${{ github.event.client_payload.run_id }}
            New or removed documentation pages require a matching portal navigation change; CI deliberately rejects incomplete navigation.
      - name: Enable guarded auto-merge when opted in
        if: >-
          vars.DOCS_UPDATES_AUTOMERGE == 'true' &&
          steps.pull-request.outputs.pull-request-number != '' &&
          steps.pull-request.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.DOCS_UPDATES_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: python -B tools/docs/auto_merge.py
