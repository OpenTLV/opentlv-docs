name: Component documentation update

on:
  repository_dispatch:
    types: [component-docs-released]

permissions:
  contents: read

concurrency:
  group: component-docs-updates
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'OpenTLV/opentlv-docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify producer and prepare pinned feed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/docs/events.py
      # An App/PAT is needed so the resulting PR starts the normal docs checks.
      # This step stages only the manifest, never code supplied by an event.
      - name: Open reviewed source update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DOCS_UPDATES_TOKEN }}
          add-paths: docs-sources.json
          branch: automation/component-${{ github.event.client_payload.source }}-${{ github.event.client_payload.commit }}
          title: Update verified component documentation sources
          commit-message: Update pinned component compatibility feed
          body: |
            Proposes a compatibility feed from a successful configured producer and a published stable release.
            Review the producer, feed records and documentation validation before merging. Existing releases remain frozen.
            Producer: https://github.com/${{ github.event.client_payload.repository }}/actions/runs/${{ github.event.client_payload.run_id }}
